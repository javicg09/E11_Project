# MongoDB local para desarrollo. Las variables se leen del .env de la raíz.
services:
  mongo:
    image: mongo:7
    container_name: e11-mongo
    restart: unless-stopped
    ports:
      # Solo accesible desde la propia máquina
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Falta MONGO_ROOT_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:?Falta MONGO_DB_NAME en .env}
      # Variables que usa el script de docker/mongo-init para crear el usuario de la aplicación
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_APP_USER: ${MONGO_APP_USER:?Falta MONGO_APP_USER en .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Falta MONGO_APP_PASSWORD en .env}
    volumes:
      - mongo-data:/data/db
      # Los scripts de este directorio solo se ejecutan cuando el volumen de datos está vacío
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
